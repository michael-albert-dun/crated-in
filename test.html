<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crated In (test)</title>
    <link rel="stylesheet" href="styles.css?v=20260927e" />
    <script defer src="src/engine.js?v=20260927a"></script>
    <script defer src="src/levels.js?v=20260927q"></script>
    <script defer src="src/candidates.js?v=20260927f"></script>
    <script defer src="src/test-config.js?v=20260927a"></script>
    <script defer src="src/game.js?v=20260927x"></script>
  </head>
  <body>
    <main>
      <!-- Same game as index.html, with test tools: candidates after the real levels, move hints, cheat button. -->
      <section id="menu-screen">
        <header>
          <h1>Crated In <small>(test)</small></h1>
        </header>

        <p class="howto">
          Same game as the main page, plus the candidate levels from the finder (dashed tiles), colour hints on the
          squares next to you, and a cheat button. Progress and settings here are kept separately.
        </p>

        <h2>Test options</h2>
        <div class="settings">
          <label><input type="checkbox" id="opt-hints" /> Show move hints (<span class="key walk">walk</span> <span class="key push">push</span> <span class="key drop">drop</span>)</label>
          <label><input type="checkbox" id="opt-gentle" /> Gentle mode (a drop that's too far is just blocked)</label>
          <label><input type="checkbox" id="opt-enough" /> Just-enough push (one bump spreads until you can walk)</label>
        </div>

        <h2>Levels <span id="progress"></span></h2>
        <div id="level-grid" role="list"></div>
      </section>

      <section id="play-screen" hidden>
        <header>
          <button type="button" id="menu-button">&larr; Menu</button>
          <select id="room-select" aria-label="Level"></select>
        </header>
        <p id="room-title"></p>

        <div class="room">
          <svg id="board" role="img" aria-label="The room, seen from above"></svg>
        </div>

        <p id="message" role="status"></p>

        <div class="bar">
          <button type="button" id="undo">Undo (z)</button>
          <button type="button" id="restart">Restart (r)</button>
          <button type="button" id="cheat" aria-pressed="false">Cheat (c)</button>
          <span id="counts"></span>
        </div>

        <p id="cheat-status" role="status"></p>
      </section>
    </main>
  </body>
</html>
