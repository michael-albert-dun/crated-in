<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crated In (pool)</title>
    <link rel="stylesheet" href="styles.css?v=20261001a" />
    <script defer src="src/engine.js?v=20261001a"></script>
    <script defer src="src/levels-test/pool.js?v=20260930a"></script>
    <script defer src="src/pool-config.js?v=20260930a"></script>
    <script defer src="src/game.js?v=20261001d"></script>
  </head>
  <body>
    <main>
      <!-- A disposable batch of levels to compare, nothing else: same game as
           index.html/test.html, but the whole grid is src/levels-test/pool.js, overwritten
           each time there's a new set to look at (see the file's own comment). -->
      <section id="menu-screen">
        <header>
          <h1>Crated In <small>(pool)</small></h1>
        </header>

        <p class="howto">
          A throwaway batch to compare and choose from, not the real level list. Move hints and a cheat
          button are on, same as the test page. This page's contents change without notice.
        </p>

        <h2>Options</h2>
        <div class="settings">
          <label><input type="checkbox" id="opt-hints" /> Show move hints (<span class="key walk">walk</span> <span class="key push">push</span> <span class="key drop">drop</span>)</label>
          <label><input type="checkbox" id="opt-gentle" /> Gentle mode (a drop that's too far is just blocked)</label>
          <label><input type="checkbox" id="opt-enough" /> Just-enough push (one bump spreads until you can walk)</label>
          <label><input type="checkbox" id="opt-slide" /> Slide-or-climb (a neighbour 1 higher slides forward if there's room, otherwise you climb it)</label>
          <label><input type="checkbox" id="opt-linepush" /> Line push (a push only ever reaches you and the square past the pile, and fails outright with no room there)</label>
        </div>

        <h2>Levels <span id="progress"></span></h2>
        <div id="level-grid" role="list"></div>
      </section>

      <section id="play-screen" hidden>
        <header>
          <button type="button" id="menu-button">&larr; Menu</button>
          <select id="room-select" aria-label="Level"></select>
        </header>
        <p id="room-title"></p>

        <div class="room">
          <svg id="board" role="img" aria-label="The room, seen from above"></svg>
        </div>

        <p id="message" role="status"></p>

        <div class="bar">
          <button type="button" id="undo">Undo (z)</button>
          <button type="button" id="restart">Restart (r)</button>
          <button type="button" id="cheat" aria-pressed="false">Cheat (c)</button>
          <span id="counts"></span>
        </div>

        <p id="cheat-status" role="status"></p>
      </section>
    </main>
  </body>
</html>
